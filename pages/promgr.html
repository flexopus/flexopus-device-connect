<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexopus x ProMGR - Digital Signage Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #121212;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 60px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .content {
            flex: 1;
            max-width: 520px;
            margin-right: 80px;
        }
        
        .title {
            font-size: 4rem;
            font-weight: 600;
            margin-bottom: 40px;
            line-height: 1.1;
        }
        
        p {
            font-size: 1.125rem;
            line-height: 1.6;
            color: #d1d5db;
            margin-bottom: 24px;
        }
        
        .image-container {
            flex-shrink: 0;
        }
        
        .signage-image {
            max-width: 650px;
            height: auto;
            border-radius: 24px;
        }
        
        .fingerprint {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 60px;
            height: 60px;
            background: #1e40af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            box-shadow: 0 4px 20px rgba(30, 64, 175, 0.3);
        }
        
        @media (max-width: 1200px) {
            .container {
                flex-direction: column;
                text-align: center;
                padding: 40px;
            }
            
            .content {
                margin-right: 0;
                margin-bottom: 60px;
                max-width: none;
            }
            
            .title {
                font-size: 3.5rem;
            }
            
            .signage-image {
                max-width: 550px;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 2.5rem;
            }
            
            .description {
                font-size: 1rem;
            }
            
            .signage-image {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="title">
                Flexopus x ProMGR
            </h1>
            <p>
                With the Flexopus and ProDVX ProMGR integration, you can setup your digital signage display in a simple way,
            </p>
            <p>
                If you need help with the setup contact<br>
                support@flexopus.com
            </p>
        </div>
        
        <div class="image-container">
            <img src="signage_display.webp" alt="Flexopus Digital Signage Display" class="signage-image">
        </div>
    </div>
</body>
</html>
